<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>diagonal</title>
	<link rel="stylesheet" href="sidebar.css" />
</head>
<body>
	<header>
		<span id="status-dot" class="dot"></span>
		<h1 data-i18n="sidebarTitle"></h1>
		<span id="status-text"></span>
	</header>

	<section id="onboarding" hidden>
		<p data-i18n="grantIntro"></p>
		<button id="grant"></button>
	</section>

	<details id="scripts-section" open>
		<summary>
			<span data-i18n="scriptsTitle"></span>
			<span id="scripts-count"></span>
		</summary>
		<label id="scripts-filter"><input type="checkbox" id="scope-page" checked /><span data-i18n="filterPage"></span></label>
		<ul id="scripts"></ul>
		<p id="empty"></p>
	</details>

	<main id="chat"></main>

	<section id="detail" hidden>
		<h2 id="detail-title"></h2>
		<div id="detail-name"></div>
		<textarea id="detail-code" spellcheck="false"></textarea>
		<div class="row">
			<button id="approve" data-i18n="approve"></button>
			<button id="discard" class="secondary" data-i18n="discard"></button>
			<button id="save" data-i18n="save"></button>
			<button id="close" class="secondary" data-i18n="close"></button>
		</div>
	</section>

	<form id="prompt-form">
		<textarea id="prompt" rows="3"></textarea>
		<button id="send" type="submit" data-i18n="send"></button>
	</form>

	<script src="sidebar.js"></script>
</body>
</html>
